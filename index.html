<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#103F33">
  <meta name="description" content="Cada Euro: controla tus ingresos, gastos, suscripciones y pagos fijos. Que no se te escape ni uno.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Cada Euro · Que no se te escape ni uno</title>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="brand"><div class="logo" aria-hidden="true"><img src="icon-192.png?diseno=3" alt="" width="42" height="42" style="display:block;width:100%;height:100%;object-fit:cover;border-radius:12px"></div><div><strong>Cada Euro</strong><small>Que no se te escape ni uno.</small></div></div>
      <button id="help-btn" class="icon-btn" aria-label="Información sobre los datos" title="Información">ⓘ</button>
    </header>
    <main id="content" class="content" aria-live="polite"></main>
    <button class="fab" id="fab" aria-label="Añadir movimiento"><span>＋</span></button>
    <nav class="nav" aria-label="Navegación principal">
      <button data-tab="inicio" class="active"><span>⌂</span>Inicio</button>
      <button data-tab="movimientos"><span>⇅</span>Movimientos</button>
      <button data-tab="fijos"><span>▣</span>Fijos</button>
      <button data-tab="presupuestos"><span>◉</span>Presupuestos</button>
      <button data-tab="ajustes"><span>⚙</span>Ajustes</button>
    </nav>
  </div>
  <div class="overlay hidden" id="overlay" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-top"><h2 id="modal-title">Nuevo movimiento</h2><button class="icon-btn" type="button" id="close-modal" aria-label="Cerrar">✕</button></div>
      <div id="modal-content"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=1.2.4" defer></script>
  <script src="swipe2.js?v=1" defer></script>
</body>
</html>
